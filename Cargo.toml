[package]
name = "rag_rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
epub = "2"
html2text = "0.17"
pdf-extract = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net"] }
tokio-stream = "0.1"
ureq = { version = "3", features = ["json"] }
